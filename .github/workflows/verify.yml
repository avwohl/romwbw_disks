name: verify

# Two jobs, split by cost.
#
#   quick  runs on every push.  Assembles w8/r8, asserts the capability
#          interlock is still in the built w8.com, and checks the committed
#          catalogs are internally consistent and have not drifted from the
#          manifests.  No upstream download, so it finishes in under a minute.
#
#   full   builds everything from the real upstream Package.zips and verifies
#          every artifact against its catalog entry.  ~420MB of downloads, so
#          it runs on demand and weekly rather than per push.
#
# um80 is deliberately NOT pinned.  A um80 output change is meant to turn this
# red: the fix is to rebuild and republish, not to freeze an old assembler.

on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install toolchain
        run: |
          python -m pip install --upgrade pip
          pip install um80
          um80 --version || true

      - name: Shell syntax
        run: for f in tools/*.sh; do sh -n "$f" || exit 1; done

      - name: Python syntax
        run: python -m compileall -q tools/

      - name: Build the host-transfer utilities
        run: sh tools/build_utils.sh

      - name: Catalogs are self-consistent and have not drifted
        run: python3 tools/check_committed.py
  full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install toolchain
        run: |
          python -m pip install --upgrade pip
          pip install um80
          sudo apt-get update
          sudo apt-get install -y cpmtools

      - name: Build everything and verify
        run: sh tools/build_all.sh

      - name: The committed catalogs match what was just built
        run: |
          git diff --exit-code catalog/ versions/ || {
            echo "The build produced catalogs that differ from the committed ones."
            echo "Run tools/build_all.sh locally and commit catalog/ and versions/."
            exit 1
          }
